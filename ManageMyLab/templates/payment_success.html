<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DentaFlow - Payment Processing</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/payment.css') }}"
    >

</head>

<body>

<div class="payment-card">

    <div class="logo">

        <div class="logo-mark">
            D
        </div>

        DentaFlow

    </div>


    <div class="status-icon processing">

        <div class="loader"></div>

    </div>


    <h1>
        Payment Processing
    </h1>


    <p class="description">

        Your payment has been submitted.

        We are waiting for Chargily to confirm
        the transaction.

    </p>


    <div class="info-box">

        Your DentaFlow access will be activated
        automatically once the payment is confirmed.

        You don't need to make another payment.

    </div>


    <a
        href="{{ url_for('payments.payment_status') }}"
        class="btn btn-primary"
    >

        Check Payment Status

    </a>


    <a
        href="{{ url_for('home') }}"
        class="back-link"
    >

        Back to DentaFlow

    </a>

</div>

</body>

</html>
