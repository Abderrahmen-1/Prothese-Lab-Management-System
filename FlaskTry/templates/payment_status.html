<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="DentaFlow payment error"
    >

    <title>DentaFlow - Payment Error</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/payment.css') }}"
    >

</head>

<body>

<div class="payment-card">

    <div class="logo">

        <div class="logo-mark">
            D
        </div>

        DentaFlow

    </div>


    <div class="status-icon error">
        !
    </div>


    <h1>
        Payment Error
    </h1>


    <p class="description">

        We couldn't create your payment session.

        Please try again. If the problem continues,
        contact DentaFlow support.

    </p>


    {% if error %}

    <div class="error-box">

        {{ error }}

    </div>

    {% endif %}


    <a
        href="{{ url_for('payments.payment') }}"
        class="btn btn-primary"
    >

        Try Again

    </a>


    <a
        href="{{ url_for('home') }}"
        class="back-link"
    >

        Back to DentaFlow

    </a>

</div>

</body>

</html>
